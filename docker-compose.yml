# docker-compose.yml - how the portal runs. Settings come from the .env file next to this file.
#   portal  : the web application (always)
#   db      : the MySQL database (always; the portal does not start until it is healthy)
#   caddy   : HTTPS front door   (only when COMPOSE_PROFILES contains "https")
#   clamav  : virus scanner      (only when COMPOSE_PROFILES contains "scan")
#
# The database user and passwords live in the .env file (MYSQL_USER,
# MYSQL_PASSWORD and MYSQL_ROOT_PASSWORD) — docker-compose only reads
# them from there, it holds no password of its own. Set them in your
# live .env BEFORE the first start. The database user is created with
# that password on first start, and changing them later does not
# change the user or password inside MySQL.
services:
  portal:
    build: .
    image: office-inventory-portal
    container_name: inventory-portal
    restart: unless-stopped          # starts again after a crash or a server reboot
    depends_on:
      db:
        condition: service_healthy  # wait until MySQL answers before starting
    ports:
      # With HTTPS set PORTAL_BIND=127.0.0.1 so the plain-HTTP port is closed to the network.
      - "${PORTAL_BIND:-0.0.0.0}:${PORTAL_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-UTC}
      PORTAL_HTTPS: ${PORTAL_HTTPS:-0}
      PORTAL_BEHIND_PROXY: ${PORTAL_BEHIND_PROXY:-0}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      REMINDER_HOUR: ${REMINDER_HOUR:-7}
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: portal
    volumes:
      - portal_data:/data            # attachments, logo, backups live here (the database lives in mysql_data)

  db:
    image: mysql:8.0
    container_name: inventory-portal-db
    restart: unless-stopped
    # The database port is NOT published to the host: only the portal
    # container can reach it, over the internal Docker network.
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: portal
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql    # the database itself lives here
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root",
             "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  caddy:
    image: caddy:2
    container_name: inventory-caddy
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - portal
    ports:
      - "${HTTPS_PORT:-443}:8443"
    environment:
      PORTAL_HOST: ${PORTAL_HOST:-localhost}
      TLS_ARGS: ${TLS_ARGS:-internal}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data             # keeps the certificate between restarts

  clamav:
    image: clamav/clamav:stable
    container_name: inventory-clamav
    profiles: ["scan"]
    restart: unless-stopped          # needs about 2 GB of RAM; the first start downloads the virus database
    volumes:
      - clamav_db:/var/lib/clamav

volumes:
  portal_data:                       # NEVER run "docker compose down -v": it deletes this volume
  mysql_data:                        # the MySQL database — same warning: "down -v" deletes it
  caddy_data:
  clamav_db:
