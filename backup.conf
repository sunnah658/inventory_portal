# backup.conf - optional settings for backup.sh (read by backup.sh).
#
# To copy every backup to ANOTHER machine automatically, remove the # in front of the
# next line and put your own user, address and folder. See README.txt section 9.
#
# REMOTE_TARGET=backupuser@192.168.1.50:/srv/backups/inventory-portal
#
# Optional: use a different ssh key or port
# SSH_OPTIONS="-i /root/.ssh/portal_backup_key -p 22"
